
name: Generate latest.json

on:
  push:
    paths:
      - "one-store.apk"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Read APK information and generate JSON
        shell: bash
        run: |
          set -e

          APK="one-store.apk"

          if [ ! -f "$APK" ]; then
            echo "APK file not found"
            exit 1
          fi

          AAPT=$(find "${ANDROID_HOME:-$ANDROID_SDK_ROOT}/build-tools" -type f -name aapt | sort -V | tail -n 1)

          if [ -z "$AAPT" ]; then
            echo "aapt not found"
            exit 1
          fi

          "$AAPT" dump badging "$APK" > apk-info.txt

          python3 - <<'PY'
          import json
          import re

          with open("apk-info.txt", encoding="utf-8") as f:
              text = f.read()

          match = re.search(
              r"package: name='([^']+)' versionCode='([^']+)' versionName='([^']*)'",
              text
          )

          if not match:
              raise SystemExit("Cannot read APK version information")

          package_name, version_code, version_name = match.groups()

          try:
              with open("update-info.json", encoding="utf-8") as f:
                  update_info = json.load(f)
          except FileNotFoundError:
              update_info = {}

          data = {
              "packageName": package_name,
              "versionName": version_name,
              "versionCode": int(version_code),
              "apkUrl": "https://raw.githubusercontent.com/xiya862-prog/one-store-apk/main/one-store.apk",
              "releaseNotes": update_info.get("releaseNotes", ""),
              "forceUpdate": bool(update_info.get("forceUpdate", False))
          }

          with open("latest.json", "w", encoding="utf-8") as f:
              json.dump(data, f, ensure_ascii=False, indent=2)
              f.write("\n")

          print(json.dumps(data, ensure_ascii=False, indent=2))
          PY

      - name: Commit latest.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add latest.json
          if ! git diff --cached --quiet; then
            git commit -m "Update latest.json from APK"
            git push
          else
            echo "latest.json is already up to date"
          fi
